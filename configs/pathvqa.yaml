ann_root: datasets/pathvqa
vqa_root: datasets/pathvqa/images
train_files: ['train']
dataset_name: pathvqa 
truncate_train_dataset_to: null

# set pretrained as a file path or an url
# pretrained: 'https://storage.googleapis.com/sfr-vision-language-research/BLIP/models/model_base_vqa_capfilt_large.pth'
pretrained: 'https://storage.googleapis.com/sfr-vision-language-research/BLIP/models/model_base_capfilt_large.pth'

# size of vit model; base or large
vit: 'base'
batch_size_train: 16 
batch_size_test: 16
vit_grad_ckpt: False
vit_ckpt_layer: 0
init_lr: 2e-5

image_size: 480

k_test: 128
inference: 'rank'

# optimizer
weight_decay: 0.05
min_lr: 0
max_epoch: 10

torch_home: /net/acadia10a/data/zkhan/torch_home
wandb: true
wandb_project: seltda
wandb_entity: null
wandb_name: null
wandb_group: pathvqa
wandb_tags: ['pathvqa', 'vqa', 'augmentation']
wandb_mode: online
wandb_watch_model: true
wandb_watch_log: all
wandb_watch_log_freq: 100
