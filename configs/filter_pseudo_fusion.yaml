input: /teamspace/uploads/aokvqa/synthetic_data_raw.json
image_root: /teamspace/uploads/coco2017
output: /teamspace/uploads/aokvqa/synthetic_data_fusion.json
report: /teamspace/uploads/aokvqa/filter_report_fusion.json

gates:
  conf:
    enabled: true
    keep_top: 0.75
  itm:
    enabled: true
    keep_top: 0.75
    clip_model: "ViT-B-32"
    clip_pretrained: "openai"
    batch_size: 32
  vqascore:
    enabled: false
    keep_top: 0.75
    model: clip-flant5-xl
    batch_size: 8
  xcons:
    enabled: true
    keep_top: 0.75
    student_ckpt: cache/student_weights/checkpoint_09.pth
    med_config: configs/med_config.json
    sbert_model: "sentence-transformers/all-MiniLM-L6-v2"
    image_size: 384
    batch_size: 8

fusion:
  enabled: true
  keep_top: 0.75
  normalize: minmax  # minmax | rank | none
  weights:
    conf: 0.34
    itm: 0.33
    xcons: 0.33

scoring_only: false
seed: 42
device: cuda
report_max_examples: 50
log_every: 200
torch_home: null
