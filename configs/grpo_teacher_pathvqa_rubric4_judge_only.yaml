image_pool:
  name: pathvqa_train
  annotations: datasets/pathvqa/train.json
  image_root: datasets/pathvqa/images
  use_ground_truth_qa: false

teacher:
  config: configs/pathvqg.yaml
  pretrained: ${oc.env:TEACHER_CKPT,cache/pathvqa_teacher_weights/checkpoint_04.pth}
  output_dir: outputs/experiments/pathvqa/pt4_j/teacher
  device: cuda
  batch_size: 2
  candidates_per_image: 8
  max_steps: 200
  epochs: 3
  save_every: 50
  lr: 1e-6
  dry_run: false

generation:
  max_length: 40
  min_length: 5
  top_p: 0.9

reward:
  judge_config: configs/prometheus_judge_pathvqa.yaml
  selected_judge_model_path: ${oc.env:SELECTED_PROMETHEUS_JUDGE,cache/prometheus-vision-7b-v1.0}
  duplicate_question_penalty: 0.0
  yes_no_answer_penalty: 0.0
  length_penalty: 0.0
  generic_answer_penalty: 0.0
  max_question_words: 30
  max_answer_words: 12

logging:
  candidates_jsonl: outputs/experiments/pathvqa/pt4_j/teacher/candidates.jsonl
  metrics_jsonl: outputs/experiments/pathvqa/pt4_j/teacher/metrics.jsonl
  judge_snapshot_json: outputs/experiments/pathvqa/pt4_j/teacher/judge_snapshot.json
  log_every: 10

seed: 42
