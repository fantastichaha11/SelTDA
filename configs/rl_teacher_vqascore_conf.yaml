rounds: 3
early_stop_delta: 0.5
torch_home: /home/phongnguyen/SelTDA/cache/torch_home

teacher:
  pretrained: cache/teacher_weights/checkpoint_04.pth
  med_config: configs/med_config.json
  image_size: 384
  vit: base
  prompt: "Question:"

data:
  image_folder: /home/phongnguyen/SelTDA/datasets/coco2017/unlabeled2017
  annotations: null
  truncate_to: 4000
  num_workers: 2

student:
  checkpoint: cache/student_weights/student_base_rl.pth
  med_config: configs/med_config.json
  image_size: 384

weak_types:
  k: 3
  student_base_eval: cache/evals/student_base/vqa_result.json
  out: orchestration/state/weak_types.json
  default: [how_many, external_knowledge, yes_no]

grpo:
  batch_size: 1
  max_images_per_step: 2
  group_size: 8
  auto_tune: false
  top_p: 0.92
  temperature: 1.0
  max_length: 30
  min_length: 5
  kl_beta: 0.1
  kl_beta_decay_gamma: 0.7
  lr: 1.0e-6
  epochs_per_round: 10
  steps_per_epoch: 80
  ref_on_cpu: true
  resume_probe_peak_mib: 20515
  round: 2
  output_dir: orchestration/state

reward:
  mode: vqascore_conf
  device: auto
  w_type: 0.0
  w_itm: 0.0
  w_grounding: 0.0
  w_learnability: 0.0
  w_kl: 0.0
  w_repetition: 0.0
  w_vqa: 1.0
  w_conf: 1.0
  vqascore_backend: t2v_metrics
  vqascore_model: clip-flant5-xl
  vqascore_checkpoint: null
  vqascore_device: cuda
  vqascore_template: 'Does this figure show "{qa}"? Please answer yes or no.'

audit:
  every_epoch: true
  backfill_after_epoch: null
  backfill_epochs: [0]
  n_audit: 50
  device: cpu
  seed: 42
  itm_large_ckpt: cache/judges/blip_itm_large.pth
  itm_vit: large
  vqa_judge_ckpt: cache/judges/blip_vqa_published.pth
  vqa_judge_fallback: cache/student_weights/checkpoint_09.pth
  hacking_eps: 0.02
  itm_dominance_tau: 0.6
  rollback_to_best_judge: true
  stop_on_judge_drop: false
  stop_on_judge_drop_eps: 0.01
  stop_on_reward_plateau: false
  stop_on_reward_plateau_eps: 0.05

hrp:
  adaptive_kl_c: 1.5
  downweight_d: 0.5
  auto_levels: [1, 2, 3]
